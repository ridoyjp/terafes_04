<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Festival AI — Private Usage Monitor</title><style>body{font:16px system-ui,sans-serif;background:#101c2c;color:#eef4ff;max-width:720px;margin:40px auto;padding:16px}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #76849a}input{width:100%;box-sizing:border-box;background:#fff;color:#111}button{margin-top:12px;cursor:pointer;background:#74d7d0;color:#142336;font-weight:bold}section{background:#1e3047;padding:20px;border-radius:15px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.metric{border:1px solid #4d6079;border-radius:10px;padding:14px}small{color:#b6c7d8}strong{display:block;font-size:24px;margin-top:6px}#msg{white-space:pre-wrap}</style></head><body><h1>Festival AI — Usage Monitor</h1><p>Private admin page. Token is held in this page's memory only, not stored or sent anywhere except to your Cloudflare Worker.</p><section><label for="token">ADMIN_STATS_TOKEN</label><input id="token" type="password" autocomplete="off" placeholder="Paste your Cloudflare secret"><button id="refresh">Refresh usage</button><button id="clear">Clear token</button><p id="msg" aria-live="polite"></p></section><section><h2>Today (UTC)</h2><div id="stats" class="grid"></div><small>Worker counters are not Google's quota totals. Check Google AI Studio for the actual API quotas.</small></section><script src="./monitor.js"></script></body></html>
